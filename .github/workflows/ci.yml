name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build world data and map
        run: npm run build
      - name: Data and unit tests
        run: npm run test:data
      - name: Browser tests (desktop + iPhone size)
        run: npm run test:e2e
      - name: Keep screenshots and built map for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-and-screenshots
          path: |
            test-results/
            viewer/dist/
