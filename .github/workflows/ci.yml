name: checks

# Runs on every pull request and every push to main.
# Two required checks: "lint" (code rules and formatting) and "test" (build + data + browser tests).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - name: Python lint and format (ruff)
        run: npm run lint:py
      - name: JavaScript lint (eslint)
        run: npm run lint:js
      - name: Formatting (prettier)
        run: npm run format:check
      - name: Shell scripts (shellcheck)
        run: npm run lint:sh
      - name: Workflow files (actionlint)
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build world data and map
        run: npm run build
      - name: Data and unit tests
        run: npm run test:data
      - name: Browser tests (desktop + iPhone size)
        run: npm run test:e2e
      - name: Keep screenshots and built map for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-and-screenshots
          path: |
            test-results/
            viewer/dist/
