name: deploy-pages

# Publishes the latest map to GitHub Pages (gh-pages branch, site root) after every change to main.
# The full test suite runs first; nothing is published if any check fails.
# PR previews live under /pr-preview/pr-<n>/ on the same branch and are left untouched here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.url.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Build and test (publish only if everything passes)
        run: npm test
      - name: Assemble site
        run: |
          mkdir -p site
          cp viewer/dist/fci_colony_map.html site/index.html
          touch site/.nojekyll
      - name: Publish to gh-pages (keeps PR previews)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
      - id: url
        run: echo "page_url=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

  # Comment on the merged pull request(s): live link on success,
  # a clear "not published" note if checks or deployment failed.
  notify:
    needs: [build-and-deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.build-and-deploy.result }}
          PAGE_URL: ${{ needs.build-and-deploy.outputs.page_url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            const merged = prs.filter(p => p.merged_at);
            if (!merged.length) { core.info(`No merged pull request for ${sha}; nothing to comment on.`); return; }
            const ok = process.env.RESULT === 'success';
            const url = process.env.PAGE_URL || `https://${owner.toLowerCase()}.github.io/${repo}/`;
            const body = ok
              ? `### Deployed\nThe map from this pull request is live: ${url}\n\nAll checks passed before publishing. Commit \`${sha.slice(0, 7)}\` · [run details](${runUrl})`
              : `### Not deployed\nChecks or deployment failed (${process.env.RESULT}). The live site still shows the previous version.\n\nCommit \`${sha.slice(0, 7)}\` · [run details](${runUrl})`;
            for (const pr of merged) {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              core.info(`Commented on #${pr.number}`);
            }
